<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>

        @font-face {
            font-family: 'TamilFont';
            src: url('{{ font_path }}');
        }

        @page {
            size: A4;
            margin: 12mm 10mm 12mm 10mm;
        }

        @page horo-last {
            size: A4;
            margin: 0;
        }

        * { box-sizing: border-box; }

        body {
            background-color: #ffffff;
            font-family: 'TamilFont', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        p {
            font-size: 10px;
            margin: 3px 0;
            padding: 0;
            color: #333;
            font-family: 'TamilFont', Arial, sans-serif;
        }

        /* ── Header ── */
        table.header { width: 100%; margin-bottom: 6px; }
        .header-left { width: 100%; }
        .header-left img { width: 100%; height: auto; }

        /* ── Wrapper ── */
        table.outer2 {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 6px;
        }
        table.outer2 > tbody > tr > td { padding: 0; }

        /* ── Details section ── */
        .details-section td { border: none; }
        .details-section p { margin: 2px 0; font-family: 'TamilFont', Arial, sans-serif; }

        table.table-div {
            width: 100%;
            border: 1px solid #008000;
            border-collapse: collapse;
            margin-bottom: 6px;
        }
        .table-div td {
            width: 50%;
            padding: 6px 8px;
            vertical-align: top;
            text-align: left;
            background-color: #ffffff;
            box-sizing: border-box;
        }
        .table-div .border-right { border-right: 1px solid #6207ac; }
        .table-div p {
            font-size: 12px;
            font-weight: 400;
            color: #008000;
            font-family: 'TamilFont', Arial, sans-serif;
            margin: 2px 0;
        }

        table.inner-table { width: 100%; border-collapse: collapse; }
        .inner-table td { padding: 2px 4px; vertical-align: top; border: none; }
        .inner-table p {
            font-size: 12px;
            font-weight: 500;
            margin: 2px 0;
            font-family: 'TamilFont', Arial, sans-serif;
            color: #008000;
        }

        /* ── Chart grid ── */
        table.outer {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            margin-bottom: 4px;
        }
        td.chart-cell { width: 43%; padding: 0; vertical-align: top; box-sizing: border-box; }
        td.spacer { width: 14%; padding: 4px 2px; vertical-align: middle; text-align: center; }

        table.inner {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            text-align: center;
            font-family: 'TamilFont', Arial, sans-serif;
            background-color: #fff;
        }
        .inner tr { height: 70px; }
        .inner td {
            width: 25%;
            height: 70px;
            max-height: 70px;
            border: 1px solid #008000;
            padding: 2px;
            color: #008000;
            font-weight: bold;
            font-size: 9px;
            font-family: 'TamilFont', Arial, sans-serif;
            word-wrap: break-word;
            word-break: break-all;
            overflow: hidden;
            vertical-align: middle;
            box-sizing: border-box;
            line-height: 1.2;
        }
        td.inner-tabledata { font-family: 'TamilFont', Arial, sans-serif; font-size: 9px; }
        .inner .highlight {
            background-color: #ffffff;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: #008000;
            font-family: 'TamilFont', Arial, sans-serif;
            overflow: visible;
        }
        .inner .highlight p {
            font-size: 10px;
            font-weight: 400;
            color: #008000;
            font-family: 'TamilFont', Arial, sans-serif;
            margin: 2px 0;
        }

        /* ── Dasa table ── */
        table.dasa-table, table.table-div-horo { width: 100%; border-collapse: collapse; }
        .dasa-table td, .table-div-horo td {
            background-color: #fff;
            padding: 4px 2px;
            text-align: center;
            vertical-align: top;
        }
        .dasa-table p, .table-div-horo p {
            font-size: 11px;
            font-weight: 400;
            text-align: center;
            color: #008000;
            font-family: 'TamilFont', Arial, sans-serif;
            margin: 2px 0;
        }

        /* ── Address / contact ── */
        table.add-info {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #008000;
        }
        .add-info td {
            width: 50%;
            background-color: #ffffff;
            padding: 5px 9px;
            vertical-align: top;
        }
        .add-info td p {
            font-size: 12px;
            font-weight: 400;
            color: #008000;
            font-family: 'TamilFont', Arial, sans-serif;
            margin: 2px 0;
        }

        table.add-info2 { width: 100%; border-collapse: collapse; }
        .add-info2 td { background-color: #fff; padding: 4px 6px; vertical-align: top; }
        .add-info2 p {
            font-size: 12px;
            font-weight: 400;
            color: #008000;
            font-family: 'TamilFont', Arial, sans-serif;
            margin: 2px 0;
        }

        .click-here { color: #008000; font-weight: 700; text-decoration: none; }
        .click-here2 { color: #6207ac; font-size: 12px; font-weight: 600; text-decoration: none; }

        /* ── Porutham page ── */
        .porutham-match { width: 100%; }
        .porutham-page { width: 100%; border-collapse: collapse; }
        .porutham-page > tr > td { padding: 0; }

        table.porutham-header { width: 100%; margin: 0 0 8px 0; border-collapse: collapse; }
        .porutham-header td { vertical-align: middle; padding: 0; }
        .porutham-header img { width: 100px; height: auto; }
        .porutham-header p {
            font-size: 16px;
            font-weight: 700;
            color: #000;
            font-family: 'TamilFont', Arial, sans-serif;
            margin: 0;
            padding-left: 8px;
        }

        h2.porutham-table-title {
            font-size: 22px;
            font-weight: 700;
            margin: 10px 0 3px 0;
            padding: 15px;
            font-family: 'TamilFont', Arial, sans-serif;
            color: #000;
        }

        table.porutham-table {
            width: 100%;
            border: 1px solid #008000;
            border-collapse: collapse;
            margin-bottom: 4px;
        }
        .porutham-table td {
            border: 1px solid #008000;
            padding: 15px 8px;
            vertical-align: middle;
            background-color: #ffffff;
        }
        .porutham-table td p {
            color: #000;
            font-size: 14px;
            font-weight: 600;
            text-align: left;
            font-family: 'TamilFont', Arial, sans-serif;
            margin: 0;
        }
        .porutham-star td { padding: 20px 8px; }

        /* ── Last page horoscope image ── */
@page horo-last {
    size: A4;
    margin: 0;
}

.horo-last-page {
    page: horo-last;
    display: block;
    width: 210mm;
    height: 297mm;
    box-sizing: border-box;
    overflow: hidden;
}

.upload-horo-bg { 
    line-height: 0; 
    font-size: 0; 
    display: block; 
}
.upload-horo-bg img { 
    width: 100%; 
    height: auto; 
    display: block; 
}

.horo-image-center {
    display: table;
    width: 100%;
    height: 185mm;
    text-align: center;
    overflow: hidden;
    box-sizing: border-box;
    padding-top: 20mm;
}

.horo-image-center img {
    display: inline-block;
    width: 70%;
    height: 60%;
    max-height: 130mm;
    object-fit: contain;
    margin: 0 auto;
    vertical-align: middle;
}
    </style>
</head>
<body>
    <table class="header">
        <tr>
            <td class="header-left">
            <img src="https://vysyamat.blob.core.windows.net/vysyamala/pdfimages/horoHeader.png" alt="Vysyamala Logo">
            </td>
        </tr>
    </table>
